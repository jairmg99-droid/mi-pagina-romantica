<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 Jair & Andrea 💗</title>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(to bottom right, #f7d1f7, #fce4ec);
  color: #5e3b76;
}

header {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(90deg, #c9a0dc, #f48fb1);
  color: white;
}

.selector-anio {
  text-align: center;
  margin: 25px 0 10px;
  font-size: 1rem;
}

.selector-anio select {
  padding: 10px 22px;
  border-radius: 25px;
  border: none;
  background: #c084d2;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  outline: none;
}

.menu {
  text-align: center;
  margin: 15px 0 30px;
}

.menu button {
  background: #c084d2;
  color: white;
  border: none;
  padding: 8px 16px;
  margin: 5px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: .3s;
}

.menu button:hover, .menu button.activo {
  background: #b76ccf;
  transform: scale(1.05);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 40px;
}

.photo {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s;
  display: flex;
  flex-direction: column;
}

.photo img {
  width: 100%;
  height: 260px;
  object-fit: contain;
  background: #fde7f3;
  padding: 10px;
  box-sizing: border-box;
  cursor: pointer;
  display: block;
}

.photo p {
  text-align: center;
  font-size: 1.05rem;
  padding: 12px;
  color: #7b3f8c;
  font-weight: 600;
  margin: 0;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.lightbox img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
}

.close {
  position: absolute;
  top: 30px;
  right: 40px;
  font-size: 2.5rem;
  color: white;
  cursor: pointer;
}

audio { display:none; }
</style>
</head>

<body>

<header>
  <h1>💜 Jair & Andrea 💗</h1>
  <p>Juntos en cada recuerdo</p>
</header>

<div class="selector-anio">
  📅 Año:
  <select onchange="cambiarAnio(this.value)" id="selectAnio">
    <option value="2025">2025</option>
    <option value="2026">2026</option>
    <option value="2027">2027</option>
  </select>
</div>

<nav class="menu">
  <button onclick="cambiarMes('todos')">💖 Todos</button>
  <button onclick="cambiarMes('enero')">Enero</button>
  <button onclick="cambiarMes('febrero')">Febrero</button>
  <button onclick="cambiarMes('marzo')">Marzo</button>
  <button onclick="cambiarMes('abril')">Abril</button>
  <button onclick="cambiarMes('mayo')">Mayo</button>
  <button onclick="cambiarMes('junio')">Junio</button>
  <button onclick="cambiarMes('julio')">Julio</button>
  <button onclick="cambiarMes('agosto')">Agosto</button>
  <button onclick="cambiarMes('septiembre')">Septiembre</button>
  <button onclick="cambiarMes('octubre')">Octubre</button>
  <button onclick="cambiarMes('noviembre')">Noviembre</button>
  <button onclick="cambiarMes('diciembre')">Diciembre</button>
  <button onclick="window.location.href='cita.html'">⭐ Especial</button>
</nav>

<!-- La galería empieza vacía, JavaScript la llenará -->
<section class="gallery" id="galeria-contenedor"></section>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="cerrar()">×</span>
  <img id="imgGrande">
</div>

<audio autoplay loop>
  <source src="music/melodia.mp3">
</audio>

<!-- AQUÍ CONECTAMOS TUS DATOS -->
<script src="datos.js"></script>

<script>
let anioActual = "2025";
let mesActual = "todos";

const galeriaContenedor = document.getElementById("galeria-contenedor");
const lightbox = document.getElementById("lightbox");
const imgGrande = document.getElementById("imgGrande");

// Cargar las fotos al inicio
generarGaleria();

function generarGaleria() {
  galeriaContenedor.innerHTML = ""; // Limpiar galería
  
  misFotos.forEach(foto => {
    // Crear contenedor
    const div = document.createElement("div");
    div.className = "photo";
    div.dataset.mes = foto.mes;
    div.dataset.anio = foto.anio;
    
    // Crear imagen
    const img = document.createElement("img");
    img.src = "fotos/" + foto.archivo;
    img.alt = foto.descripcion;
    img.onclick = () => abrirLightbox(img.src);
    
    // Crear texto
    const p = document.createElement("p");
    p.textContent = foto.descripcion;
    
    div.appendChild(img);
    div.appendChild(p);
    galeriaContenedor.appendChild(div);
  });
  
  aplicarFiltro();
}

function abrirLightbox(src) {
  lightbox.style.display = "flex";
  imgGrande.src = src;
}

function cerrar() {
  lightbox.style.display = "none";
}

function cambiarAnio(anio) {
  anioActual = anio;
  aplicarFiltro();
}

function cambiarMes(mes) {
  mesActual = mes;
  aplicarFiltro();
}

function aplicarFiltro() {
  const todasLasFotos = document.querySelectorAll(".photo");
  todasLasFotos.forEach(foto => {
    const mes = foto.dataset.mes;
    const anio = foto.dataset.anio;
    const okMes = mesActual === "todos" || mes === mesActual;
    const okAnio = anio === anioActual;
    foto.style.display = (okMes && okAnio) ? "flex" : "none";
  });
}
</script>

</body>
</html>
